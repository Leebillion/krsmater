# master.mykrs.com 서버 블록(server { ... }) 안에 추가한다. 기존 / (dist)와 /api 설정은 그대로 둔다.

# 마스터 편집(editor/, Python, 127.0.0.1:8000). 끝의 슬래시가 /editor 접두어를 떼고 넘긴다.
location = /editor {
    return 301 /editor/;
}
location /editor/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 전체·폐점 마스터(약 6MB)와 통합 엑셀(약 5MB) 업로드, 10만 행 출력 저장 시간
    client_max_body_size 60m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 기존 /api 설정에도 다음이 없다면 추가한다(관리자 게시 시 10만 행 마스터 저장 시간).
