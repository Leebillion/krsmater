<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 마스터 용량 축소</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div id="app">
    <header id="file-bar" class="file-bar" aria-label="불러온 파일"></header>

    <div class="body">
      <nav id="sidebar" class="sidebar" aria-label="작업 단계">
        <button type="button" data-group="compare">① 비교</button>
        <button type="button" data-group="reduce">② 감축</button>
        <button type="button" data-group="product">③ 상품 DB</button>
        <button type="button" data-group="output">④ 출력</button>
        <div class="sidebar-foot">
          <button type="button" id="logout" class="link">로그아웃</button>
        </div>
      </nav>

      <main class="main">
        <div id="toolbars"></div>

        <section id="search-area">
          <div class="search-bar">
            <label for="search-field">검색</label>
            <select id="search-field">
              <option value="상품명">상품명</option>
              <option value="바코드">바코드</option>
            </select>
            <input id="search-text" type="search" size="34" placeholder="검색어 입력 후 Enter">
            <button type="button" id="search-apply">검색</button>
            <button type="button" id="search-clear">전체 보기</button>
            <span class="gap"></span>
            <button type="button" id="preset-add">＋ 검색어 저장</button>
            <button type="button" id="preset-manage">검색어 관리</button>
          </div>
          <div id="presets" class="presets"></div>
        </section>

        <div id="tabs" class="tabs" role="tablist"></div>
        <div id="table-host" class="table-host"></div>

        <section id="output-panel" class="output-panel" hidden>
          <p class="muted">감축 작업 결과와 상단에서 불러온 단축·전체·폐점 마스터로 출력 파일을 한 번에 저장합니다.
            담배·FF 제거는 저장 시점 필터라서 감축본 자체는 그대로 유지됩니다.</p>
          <table class="grid">
            <thead>
              <tr><th>출력</th><th>기준 행</th><th>최종 제외</th><th>추가 / 복구</th><th class="num">예상 행수</th><th>상태</th></tr>
            </thead>
            <tbody id="output-rows"></tbody>
          </table>
        </section>
      </main>
    </div>

    <footer class="status-bar">
      <span id="status" class="status"></span>
      <span id="counter" class="counter"></span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <script type="module" src="static/app.js"></script>
</body>
</html>
