<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 마스터 용량 축소 · 로그인</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body class="login-page">
  <form id="login-form" class="login-card" autocomplete="off">
    <h1>상품 마스터 용량 축소</h1>
    <p class="muted">접속 비밀번호를 입력하세요.</p>
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required autofocus>
    <button type="submit" class="primary">로그인</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
  <script src="static/login.js"></script>
</body>
</html>
